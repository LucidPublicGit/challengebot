name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk
      - run: python -m pip install -r requirements.txt pytest pip-audit
      - run: python -m pytest tests
      - run: python -m pip_audit -r requirements.txt
