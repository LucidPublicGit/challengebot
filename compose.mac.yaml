name: challengetracker
services:
  challengetracker:
    environment:
      TZ: America/Los_Angeles
      FORWARDED_ALLOW_IPS: "127.0.0.1,172.19.0.1,172.30.50.2,172.30.50.250"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      default: {}
      apps: {}
  tailscale:
    image: tailscale/tailscale@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: challenge-tracker-tailscale
    hostname: challenge-tracker-gateway
    environment:
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: challenge-tracker
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_BOOT_TIMEOUT: "30m"
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./config/tailscale:/config:ro
    networks:
      apps:
        ipv4_address: 172.30.50.250
    cap_add: [net_admin, net_raw]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json | grep -q 'BackendState.*Running'"]
      interval: 30s
      timeout: 10s
      start_period: 30m
      retries: 3
networks:
  apps:
    name: mini-services
    external: true
