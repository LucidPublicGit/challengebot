services:
  challengetracker:
    build: .
    container_name: challengetracker
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    env_file:
      - .env
    environment:
      UI_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${UI_PORT:-8090}:8090"
    volumes:
      - ./data:/app/data
      - ./challenges:/app/challenges:ro
      - ./completion_pictures:/app/completion_pictures:ro
      - ./new_challenger:/app/new_challenger:ro
    # Single replica only — SQLite one-writer.
